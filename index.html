<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>তথ্য সংগ্রহ ফর্ম | Hazi Mahe Alam Complex</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:28px 14px;background:#f3f7f4;color:#17251c;font-family:system-ui,-apple-system,"Noto Sans Bengali","Nirmala UI",sans-serif}
    .wrap{max-width:620px;margin:auto}
    .brand{text-align:center;margin-bottom:18px}
    .brand h1{font-size:clamp(23px,5vw,31px);margin:0 0 6px;color:#14532d}
    .brand p{margin:0;color:#587064}
    .card{background:#fff;border:1px solid #e1eae3;border-radius:18px;padding:25px;box-shadow:0 10px 30px rgba(20,83,45,.07)}
    h2{margin:0 0 5px;font-size:23px}
    .sub{margin:0 0 22px;color:#68796f}
    label{display:block;font-weight:650;margin:16px 0 7px}
    .req{color:#c62828}
    input,textarea{width:100%;border:1px solid #cbd8ce;border-radius:10px;padding:12px 13px;font:inherit;font-size:16px;background:#fff}
    input:focus,textarea:focus{outline:3px solid #d7f0df;border-color:#27834b}
    textarea{min-height:90px;resize:vertical}
    button{width:100%;margin-top:22px;border:0;border-radius:11px;padding:14px;background:#166534;color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #message{display:none;margin-top:16px;padding:12px;border-radius:10px;line-height:1.6}
    #message.ok{display:block;background:#e8f5ec;color:#14532d}
    #message.err{display:block;background:#fff0f0;color:#a11b1b}
    .note{font-size:13px;color:#718078;text-align:center;margin:17px 0 0}
    @media(max-width:480px){body{padding:18px 10px}.card{padding:19px}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <h1>Hazi Mahe Alam Complex</h1>
      <p>Azad Nagar Bazar, Ramgoti, Laxmipur</p>
    </header>
    <section class="card">
      <h2>তথ্য সংগ্রহ ফর্ম</h2>
      <p class="sub">ব্যক্তিগত তথ্য প্রদান করুন</p>
      <form id="infoForm">
        <label for="name">নাম <span class="req">*</span></label>
        <input id="name" name="name" required maxlength="120" autocomplete="name" placeholder="আপনার পূর্ণ নাম">

        <label for="fatherName">পিতার নাম <span class="req">*</span></label>
        <input id="fatherName" name="fatherName" required maxlength="120" placeholder="পিতার পূর্ণ নাম">

        <label for="houseName">বাড়ির নাম <span class="req">*</span></label>
        <input id="houseName" name="houseName" required maxlength="160" placeholder="বাড়ির নাম">

        <label for="phone">ফোন নম্বর <span class="req">*</span></label>
        <input id="phone" name="phone" type="tel" required maxlength="25" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX">

        <label for="occupation">পেশা <span style="font-weight:400;color:#718078">(ঐচ্ছিক)</span></label>
        <input id="occupation" name="occupation" maxlength="100" placeholder="আপনার পেশা">

        <label for="remark">মন্তব্য <span style="font-weight:400;color:#718078">(ঐচ্ছিক)</span></label>
        <textarea id="remark" name="remark" maxlength="1000" placeholder="প্রয়োজনে কিছু লিখুন"></textarea>

        <button id="submitBtn" type="submit">তথ্য জমা দিন</button>
        <div id="message" role="status" aria-live="polite"></div>
      </form>
    </section>
    <p class="note">(*) চিহ্নিত ঘরগুলো পূরণ করা বাধ্যতামূলক।</p>
  </main>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWL79UyvARIYSkva5RELFMGBVLKCwRLubmi34IZLyAptAq7J6yDkslryj6hjVCvy6FAg/exec";
    const form = document.getElementById("infoForm");
    const button = document.getElementById("submitBtn");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const data = Object.fromEntries(new FormData(form).entries());
      button.disabled = true;
      button.textContent = "জমা হচ্ছে...";
      message.className = "";
      message.style.display = "none";

      try {
        // Apps Script cross-origin POST: no-cors response cannot be read by the browser.
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {"Content-Type": "text/plain;charset=utf-8"},
          body: JSON.stringify(data)
        });
        message.textContent = "আপনার তথ্য পাঠানো হয়েছে। অনুগ্রহ করে নিশ্চিত হওয়ার জন্য কর্তৃপক্ষের সঙ্গে যোগাযোগ করুন।";
        message.className = "ok";
        form.reset();
      } catch (error) {
        message.textContent = "তথ্য পাঠানো যায়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।";
        message.className = "err";
      } finally {
        button.disabled = false;
        button.textContent = "তথ্য জমা দিন";
      }
    });
  </script>
</body>
</html>
